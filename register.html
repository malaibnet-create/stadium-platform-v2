<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.malaibnet.com;">
    <title>إنشاء حساب - منصة ملاعب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="qrcodejs-1.0.0.min.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #10b981;
            --bg-color: #f8fafc;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .register-container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }
        .logo span { color: var(--secondary-color); }
        h2 { margin-bottom: 1.5rem; color: #1e293b; }
        
        .form-group {
            text-align: right;
            margin-bottom: 1.2rem;
        }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }
        input:focus { border-color: var(--primary-color); outline: none; }
        
        .hint { font-size: 0.8rem; color: #64748b; margin-top: 4px; }
        
        .btn-submit {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover { background: #1d4ed8; }
        
        .footer-links { margin-top: 1.5rem; font-size: 0.9rem; }
        .footer-links a { color: var(--primary-color); text-decoration: none; }

        #otpModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; padding: 2rem; border-radius: 12px; text-align: center;
        }
    </style>
</head>
<body>

<div class="register-container">
    <div class="logo">ملاعب<span>.net</span></div>
    <h2>إنشاء حساب جديد</h2>
    
    <form id="registerForm">
        <div class="form-group">
            <label>الاسم الكامل</label>
            <input type="text" id="fullName" placeholder="أدخل اسمك" required>
        </div>
        
        <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="email" placeholder="example@mail.com" required>
        </div>
        
       <div class="form-group">
    <label style="display: block; font-weight: bold;">كلمة المرور</label>
    <input type="password" id="password" placeholder="********" required style="width: 100%; padding: 10px; margin-top: 5px;">
    <small style="display: block; color: #d97706; margin-top: 5px; font-size: 0.85rem; line-height: 1.4;">
        ⚠️ يرجى تذكر الرقم السري جيداً، فهو وسيلتك الوحيدة لدخول لوحة التحكم.
    </small>
</div>
        
        <div class="form-group">
            <label>اسم الملعب أو الجمعية</label>
            <input type="text" id="stadiumName" placeholder="مثلاً: ملعب السعادة" required>
            <p class="hint">يمكنك تغيير هذا لاحقاً من الإعدادات</p>
        </div>
        
        <button type="button" class="btn-submit" onclick="showOTP()">متابعة لإنشاء الحساب</button>
    </form>

    <div class="footer-links">
        لديك حساب بالفعل؟ <a href="index.html">العودة إلى الصفحة الرئيسية</a>
    </div>
</div>

<div id="otpModal">
    <div class="modal-content">
        <h3>تأكيد البريد الإلكتروني</h3>
        <p>لقد أرسلنا رمزاً إلى بريدك، أدخله هنا:</p>
        <input type="text" id="otpCode" placeholder="- - - -" style="text-align: center; letter-spacing: 10px; font-size: 1.5rem;">
        <p id="otpStatus" style="min-height:24px;color:#64748b;text-align:center;"></p>
        <br><br>
        <button class="btn-submit" onclick="verifyOTP()">تأكيد ودخول</button>
    </div>
</div>

<script>
  // Cloudflare Worker
const APPS_SCRIPT_BASE_URL = 'https://api.malaibnet.com';

const scriptURL = APPS_SCRIPT_BASE_URL;
async function fetchWithTimeout(url, options = {}, timeoutMs = 25000) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
    try {
        return await fetch(url, { ...options, signal: controller.signal });
    } catch (error) {
        if (error?.name === 'AbortError') {
            throw new Error('الاتصال بطيء جدًا أو انقطع. تحقق من اتصال Wi‑Fi وحاول مرة أخرى.');
        }
        throw error;
    } finally {
        clearTimeout(timeoutId);
    }
}
    function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>"']/g, ch => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        }[ch]));
    }

  const registerParams = new URLSearchParams(window.location.search);
const registerMode = registerParams.get('mode');
const parentSlug = registerParams.get('parent') || "";
const parentPass = registerParams.get('parentPass') || "";
const isSubStadiumMode = registerMode === "addSubStadium";

document.addEventListener('DOMContentLoaded', function () {
    if (!isSubStadiumMode) return;

    const title = document.querySelector('.register-container h2');
    const submitBtn = document.querySelector('.btn-submit');
    const footerLinks = document.querySelector('.footer-links');

    if (title) title.innerText = "إضافة ملعب جديد";
    if (submitBtn) submitBtn.innerText = "متابعة لإضافة الملعب";
    if (footerLinks) footerLinks.style.display = "none";
});
    let generatedOTP = ""; // لتخزين الرمز مؤقتاً

    async function showOTP() {
    const fullName = document.getElementById('fullName').value;
    const email = document.getElementById('email').value;
    const stadiumName = document.getElementById('stadiumName').value;
    const password = document.getElementById('password').value.trim();

    if (!fullName || !email || !password || !stadiumName) {
        alert("يرجى ملء جميع الخانات");
        return;
    }
    if (password.length < 10) {
        alert("يجب أن تتكون كلمة المرور من 10 أحرف على الأقل.");
        return;
    }

    const btn = document.querySelector('.btn-submit');
    btn.innerText = "جاري إرسال الرمز...";
    btn.disabled = true;
    document.getElementById('otpModal').style.display = 'flex';
    const otpStatus = document.getElementById('otpStatus');
    if (otpStatus) otpStatus.textContent = 'جاري إرسال الرمز... يمكنك إدخاله عند وصوله إلى بريدك.';

    // الخطوة 1: طلب الرمز من جوجل سكريبت مع إضافة المفتاح السري
    try {
        // تم إضافة &key لضمان أن الطلب قادم من موقعك فقط
        const response = await fetchWithTimeout(`${scriptURL}?action=sendOTP&email=${encodeURIComponent(email)}`, {
            cache: 'no-store'
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        // استخراج النص من الاستجابة (الذي سيكون الهاش المشفر)
        const result = (await response.text()).trim();
        
        if (result !== "Sent") {
            alert("فشل إرسال الإيميل. تأكد من صحة البريد أو صلاحيات الوصول.");
        } else {
            document.getElementById('otpModal').style.display = 'flex';
        }
    } catch (e) {
        console.error(e);
        alert(e.message || "تعذر الاتصال بالخادم. تحقق من اتصال Wi‑Fi وحاول مرة أخرى.");
    } finally {
        btn.innerText = "متابعة لإنشاء الحساب";
        btn.disabled = false;
    }
}

  async function verifyOTP() {
    const userOTP = document.getElementById('otpCode').value;
    const btn = document.querySelector('#otpModal .btn-submit');
    if (btn.disabled) return;
    btn.disabled = true;
    const originalText = btn.innerText;
    btn.innerText = "جاري التحقق...";

    const verifyURL = `${scriptURL}?action=verifyOTP` +
        `&email=${encodeURIComponent(document.getElementById('email').value.trim())}` +
        `&otp=${encodeURIComponent(userOTP.trim())}`;

    let verifyResult;
    try {
        const verifyResponse = await fetchWithTimeout(`${verifyURL}&_t=${Date.now()}`, {
            method: 'GET',
            credentials: 'include',
            cache: 'no-store',
            headers: { 'Accept': 'application/json' }
        });
        const rawVerifyResult = await verifyResponse.text();
        if (!verifyResponse.ok) {
            throw new Error(`OTP verification endpoint returned HTTP ${verifyResponse.status}`);
        }
        try {
            verifyResult = JSON.parse(rawVerifyResult);
        } catch {
            verifyResult = { result: "Error", message: "استجابة غير صالحة من خادم التحقق" };
        }
    } catch (error) {
        console.error("OTP verification failed:", error);
        const statusHint = /HTTP 404/.test(String(error?.message || ""))
            ? "الخدمة غير موجودة حالياً (HTTP 404). يجب نشر نسخة Worker التي تحتوي على verifyOTP."
            : "تعذر الاتصال بخادم التحقق. حاول مرة أخرى.";
        alert(error.message || statusHint);
        btn.disabled = false;
        btn.innerText = originalText;
        return;
    }

    if (verifyResult.result !== "Verified" || !verifyResult.token) {
        alert(verifyResult.message || "الرمز غير صحيح أو منتهي الصلاحية، حاول مجدداً.");
        btn.disabled = false;
        btn.innerText = originalText;
        return;
    }

    // الآن سيعمل هذا الجزء بشكل صحيح
    btn.innerText = "جاري الحفظ النهائي...";
    btn.disabled = true;

    const fullName = document.getElementById('fullName').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value.trim();
    const stadiumName = document.getElementById('stadiumName').value;

    try {
        const response = await fetchWithTimeout(`${scriptURL}?action=registerAccount`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'text/plain' },
            body: JSON.stringify({
                fullName,
                email,
                password,
                stadiumName,
                otpToken: verifyResult.token,
                parentSlug: isSubStadiumMode ? parentSlug : "",
                parentPass: isSubStadiumMode ? parentPass : ""
            })
        });
        const resultText = await response.text();

        if (resultText.includes("Success:")) {
            document.getElementById('otpModal').style.display = 'none';
            const finalSlug = resultText.split(":")[1]?.trim(); // استخراج المعرف العشوائي مثل st-xxxx
            if (!finalSlug || !/^[a-zA-Z0-9_-]{2,100}$/.test(finalSlug)) {
                throw new Error('Invalid stadium identifier returned by server');
            }

            // ينشئ التسجيل الحساب فقط؛ اطلب جلسة إدارة مستقلة قبل فتح لوحة التحكم.
            const authResponse = await fetchWithTimeout(`${scriptURL}?action=adminAuth`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ action: 'adminAuth', id: finalSlug, password }),
                credentials: 'include',
                cache: 'no-store'
            });
            const authResult = await authResponse.json().catch(() => null);
            if (!authResponse.ok || authResult?.result !== 'success') {
                throw new Error('تم إنشاء الحساب، لكن تعذر بدء جلسة لوحة الإدارة. سجّل الدخول بكلمة المرور التي أنشأتها.');
            }

            localStorage.setItem('lastVisitedStadiumId', finalSlug);
            const userLink = new URL(
                `booking.html?id=${encodeURIComponent(finalSlug)}`,
                window.location.href
            ).href;

            // استبدال محتوى الصفحة بواجهة النجاح الجميلة
            document.querySelector('.register-container').innerHTML = `
                <div style="padding: 10px;">
                   <h2 style="color: var(--secondary-color);">${isSubStadiumMode ? 'تمت إضافة الملعب بنجاح!' : 'تم إنشاء الحساب بنجاح!'}</h2>
                    <p>أهلاً بك <b>${escapeHTML(fullName)}</b> في منصتنا.</p>
                    <hr style="border: 0.5px solid #eee; margin: 20px 0;">
                    
                    <p style="font-size: 0.9rem; color: #64748b;">رابط صفحة الحجز الخاصة بملعبك:</p>
                    <div style="background: #f1f5f9; padding: 10px; border-radius: 8px; word-break: break-all; font-size: 0.85rem; margin-bottom: 10px;">
                        ${userLink}
                    </div>
                    
                    <button id="copyUserLinkBtn"
                            style="background: #64748b; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-bottom: 20px;">
                        نسخ الرابط
                    </button>

                    <div id="qrcode" style="display: flex; justify-content: center; margin-bottom: 15px;"></div>
                    <p class="hint">صور الشاشة أو احفظ رمز QR لوضعه في مدخل الملعب</p>
                    <button id="downloadQrBtn" type="button" style="background:#0f766e;color:#fff;border:0;padding:11px 18px;border-radius:8px;cursor:pointer;margin:5px 0 14px;font-weight:700;font-size:1rem;">
                        ⬇️ تنزيل صورة QR للملعب
                    </button>
                    <div style="background:#eff6ff;color:#1e3a8a;border:1px solid #bfdbfe;border-radius:8px;padding:10px;margin:4px 0 14px;font-size:.9rem;line-height:1.7;">
                        صوّر الكود بهاتفك للحجز من تطبيق الملعب
                    </div>

                    <button id="openDashboardBtn"
                            class="btn-submit" style="margin-top: 20px;">
                        الدخول للوحة التحكم
                    </button>
                </div>
            `;

            document.getElementById('copyUserLinkBtn')?.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(userLink);
                    alert('تم نسخ الرابط!');
                } catch {
                    alert('تعذر نسخ الرابط تلقائياً. انسخه يدوياً.');
                }
            });
            document.getElementById('openDashboardBtn')?.addEventListener('click', () => {
                window.location.href = `dashboard.html?id=${encodeURIComponent(finalSlug)}`;
            });

            // الانتقال تلقائياً إلى لوحة التحكم بعد نجاح إنشاء الحساب.
            // توليد رمز QR فوراً
            new QRCode(document.getElementById("qrcode"), {
                text: userLink,
                width: 160,
                height: 160
            });
            document.getElementById('downloadQrBtn')?.addEventListener('click', () => downloadQrCard(userLink, finalSlug));
            showOwnerGuideOnce(finalSlug);

        } else {
            alert(resultText === "OTP Required"
                ? "انتهت جلسة التحقق. اطلب رمزًا جديدًا ثم حاول مرة أخرى."
                : `تعذر إنشاء الحساب: ${resultText.slice(0, 160)}`);
            btn.disabled = false;
        }
    } catch (e) {
        alert(e.message || "تعذر إنشاء الحساب بسبب بطء الاتصال. تحقق من Wi‑Fi وحاول مرة أخرى.");
        btn.disabled = false;
    }
}
function showOwnerGuideOnce(slug) {
    const key = `malaib_owner_guide_seen_${slug}`;
    if (localStorage.getItem(key)) return;
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;inset:0;background:#0f172acc;display:flex;align-items:center;justify-content:center;z-index:9999;padding:18px;direction:rtl;';
    modal.innerHTML = `<div style="max-width:460px;background:#fff;border-radius:16px;padding:24px;box-shadow:0 20px 50px #0005;text-align:right;font-family:Arial,sans-serif;color:#172033;line-height:1.8;">
      <h3 style="margin-top:0;color:#2563eb;">أين توجد لوحة المسؤول؟</h3>
      <p>تم إنشاء حساب ملعبك بنجاح. لإدارة الأسعار وساعات العمل والبيانات، اضغط على زر <strong>الدخول للوحة التحكم</strong> الموجود أسفل هذه الصفحة.</p>
      <p>يمكنك لاحقًا فتح لوحة التحكم من الرابط:</p>
      <code style="display:block;direction:ltr;background:#f1f5f9;padding:8px;border-radius:7px;word-break:break-all;">dashboard.html?id=${escapeHTML(slug)}</code>
      <button id="closeOwnerGuide" style="width:100%;margin-top:18px;background:#2563eb;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer;font-weight:700;">فهمت، متابعة</button>
    </div>`;
    document.body.appendChild(modal);
    document.getElementById('closeOwnerGuide').onclick = () => { localStorage.setItem(key, '1'); modal.remove(); };
}

function downloadQrCard(userLink, slug) {
    const source = document.querySelector('#qrcode canvas, #qrcode img');
    if (!source) { alert('يرجى الانتظار حتى يظهر رمز QR ثم حاول مرة أخرى.'); return; }
    const canvas = document.createElement('canvas');
    canvas.width = 900; canvas.height = 1120;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#172033'; ctx.textAlign = 'center';
    ctx.font = 'bold 42px Arial'; ctx.fillText('احجز ملعبك بسهولة', 450, 80);
    ctx.font = 'bold 34px Arial'; ctx.fillText('صوّر هذا الكود بهاتفك للحجز', 450, 145);
    const finish = () => {
      ctx.fillStyle = '#2563eb'; ctx.font = 'bold 36px Arial'; ctx.fillText('افتح كاميرا الهاتف وامسح الكود', 450, 900);
      ctx.fillStyle = '#64748b'; ctx.font = '24px Arial'; ctx.fillText('سيتم فتح صفحة حجز هذا الملعب', 450, 955);
      const a = document.createElement('a'); a.download = `malaibnet-qr-${slug}.png`; a.href = canvas.toDataURL('image/png'); a.click();
    };
    if (source.tagName.toLowerCase() === 'canvas') { ctx.drawImage(source, 140, 190, 620, 620); finish(); }
    else { const img = new Image(); img.onload = () => { ctx.drawImage(img, 140, 190, 620, 620); finish(); }; img.src = source.src; }
}
</script>
</body>
</html>
